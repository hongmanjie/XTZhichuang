<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1330"/><stop offset="1" stop-color="#0A0714"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2A2140" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#grid)"/>
  <circle cx="160" cy="90" r="85" fill="#8B5CF6" opacity="0.10"/>

  <!-- 素材卡片墙（透视排列） -->
  <g transform="skewY(-4)">
    <g opacity="0.45">
      <rect x="38" y="46" width="52" height="38" rx="6" fill="#120D20" stroke="#2A2140"/>
      <rect x="98" y="40" width="52" height="38" rx="6" fill="#120D20" stroke="#2A2140"/>
      <rect x="218" y="46" width="52" height="38" rx="6" fill="#120D20" stroke="#2A2140"/>
      <rect x="38" y="96" width="52" height="38" rx="6" fill="#120D20" stroke="#2A2140"/>
      <rect x="218" y="96" width="52" height="38" rx="6" fill="#120D20" stroke="#2A2140"/>
    </g>
    <g opacity="0.7">
      <rect x="98" y="96" width="52" height="38" rx="6" fill="#1A1330" stroke="#3A2F5A"/>
      <path d="M118 107l14 8-14 8z" fill="#7D74A3"/>
      <rect x="218" y="146" width="52" height="0" rx="6" fill="none"/>
    </g>
  </g>

  <!-- 中央高亮主卡 -->
  <g filter="url(#glow)">
    <rect x="150" y="52" width="76" height="62" rx="10" fill="#1A1330" stroke="url(#ac)" stroke-width="2"/>
    <rect x="158" y="60" width="60" height="34" rx="6" fill="url(#ac)" opacity="0.4"/>
    <path d="M182 68l16 10-16 10z" fill="#E6E1F5"/>
    <rect x="158" y="98" width="36" height="5" rx="2.5" fill="#3A2F5A"/>
  </g>

  <!-- 环绕粒子 -->
  <g filter="url(#glow)">
    <circle cx="60" cy="140" r="2.5" fill="#EABB5C"/>
    <circle cx="262" cy="130" r="2.5" fill="#D946EF"/>
    <circle cx="248" cy="34" r="2" fill="#C4B5FD"/>
    <circle cx="80" cy="28" r="2" fill="#8B5CF6"/>
  </g>
  <path d="M106 60q22-18 40-8M226 118q16 10 30 2" fill="none" stroke="#3A2F5A" stroke-width="1.5" stroke-dasharray="3 4"/>

  <text x="14" y="166" font-size="9" fill="#5B5280" font-family="sans-serif" letter-spacing="2">MATERIAL FIELD</text>
</svg>
