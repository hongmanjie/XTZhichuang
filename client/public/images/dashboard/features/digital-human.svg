<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1330"/><stop offset="1" stop-color="#0A0714"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2A2140" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#grid)"/>
  <circle cx="160" cy="92" r="80" fill="#D946EF" opacity="0.10"/>

  <!-- 轨道环 -->
  <ellipse cx="160" cy="92" rx="86" ry="34" fill="none" stroke="#3A2F5A" stroke-width="1.5" transform="rotate(-14 160 92)"/>
  <ellipse cx="160" cy="92" rx="104" ry="42" fill="none" stroke="#2A2140" stroke-dasharray="3 5" transform="rotate(-14 160 92)"/>

  <!-- 数字人剪影 -->
  <g filter="url(#glow)">
    <circle cx="160" cy="72" r="24" fill="url(#body)"/>
    <path d="M160 100c-26 0-42 14-30 34h60c12 0-4-34-30-34z" fill="url(#body)" opacity="0.85"/>
  </g>
  <!-- 面部扫描线 -->
  <path d="M142 66h36M140 74h40M144 82h32" stroke="#0A0714" stroke-width="1.4" opacity="0.5"/>

  <!-- 粒子 -->
  <g filter="url(#glow)">
    <circle cx="94" cy="52" r="2.5" fill="#EABB5C"/>
    <circle cx="228" cy="44" r="2.5" fill="#C4B5FD"/>
    <circle cx="248" cy="102" r="2" fill="#D946EF"/>
    <circle cx="76" cy="108" r="2" fill="#8B5CF6"/>
    <circle cx="112" cy="136" r="2" fill="#22D3EE"/>
    <circle cx="212" cy="136" r="2" fill="#8B5CF6"/>
  </g>

  <!-- 换装小卡 -->
  <g opacity="0.9">
    <rect x="36" y="118" width="34" height="42" rx="6" fill="#120D20" stroke="#3A2F5A"/>
    <circle cx="53" cy="132" r="7" fill="#2A2140"/>
    <path d="M53 140c-8 0-12 5-10 12h20c2-7-2-12-10-12z" fill="#2A2140"/>
    <rect x="250" y="118" width="34" height="42" rx="6" fill="#120D20" stroke="url(#ac)" stroke-width="1.5"/>
    <circle cx="267" cy="132" r="7" fill="url(#ac)" opacity="0.6"/>
    <path d="M267 140c-8 0-12 5-10 12h20c2-7-2-12-10-12z" fill="url(#ac)" opacity="0.6"/>
  </g>

  <text x="14" y="166" font-size="9" fill="#5B5280" font-family="sans-serif" letter-spacing="2">DIGITAL HUMAN</text>
</svg>
