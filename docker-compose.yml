services:
  app:
    build:
      context: .
      args:
        VITE_BASE_PATH: /xtzc/
    image: yimetai-app:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      MODELGATE_API_KEY: ${MODELGATE_API_KEY:?Set MODELGATE_API_KEY in the deployment environment}
      MODELGATE_BASE: ${MODELGATE_BASE:?Set MODELGATE_BASE in the deployment environment}
      MODELGATE_ENABLED: "true"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-modelgate}
      EMBEDDING_DIRECT_BASE_URL: ${EMBEDDING_DIRECT_BASE_URL:-}
      EMBEDDING_DIRECT_MODEL: ${EMBEDDING_DIRECT_MODEL:-qwen3-vl-embedding-2b}
      LIPSYNC_PROVIDER: ${LIPSYNC_PROVIDER:-disabled}
      LIPSYNC_DIRECT_BASE_URL: ${LIPSYNC_DIRECT_BASE_URL:-}
      LIPSYNC_TIMEOUT_MS: ${LIPSYNC_TIMEOUT_MS:-900000}
      AI_REAL_ENABLED: "true"
      APP_BASE_PATH: "/xtzc"
      AI_TASK_CONCURRENCY: ${AI_TASK_CONCURRENCY:-1}
      TTS_TASK_CONCURRENCY: ${TTS_TASK_CONCURRENCY:-1}
      INDEX_TTS_BASE_URL: ${INDEX_TTS_BASE_URL:-}
      INDEX_TTS_SYNTHESIS_PROVIDER: ${INDEX_TTS_SYNTHESIS_PROVIDER:-direct}
      SUPER_RES_POINTS_PER_SECOND: ${SUPER_RES_POINTS_PER_SECOND:-20}
      SUBTITLE_TRANSCRIBE_POINTS: ${SUBTITLE_TRANSCRIBE_POINTS:-10}
      ES_NODE: ${ES_NODE:-http://elasticsearch:9200}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - app-data:/app/server/data
      - app-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  app-data:
  app-uploads:
  es-data:
