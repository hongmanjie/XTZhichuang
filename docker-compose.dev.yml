name: xtzc-zsc-dev
services:
  app:
    image: ${DEV_APP_IMAGE:-xtzc-dev-base:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      APP_BASE_PATH: /xtzc
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.dev}
      MODELGATE_BASE: ${MODELGATE_BASE:?Set MODELGATE_BASE in .env.dev}
      MODELGATE_API_KEY: ${MODELGATE_API_KEY:?Set MODELGATE_API_KEY in .env.dev}
      MODELGATE_ENABLED: "true"
      ALIGNMENT_PROVIDER: ${ALIGNMENT_PROVIDER:-disabled}
      ALIGN_SERVICE_BASE_URL: ${ALIGN_SERVICE_BASE_URL:-}
      ALIGN_SERVICE_TOKEN: ${ALIGN_SERVICE_TOKEN:-}
      VISION_PROVIDER: ${VISION_PROVIDER:-disabled}
      VISION_DIRECT_BASE_URL: ${VISION_DIRECT_BASE_URL:-}
      VISION_DIRECT_MODEL: ${VISION_DIRECT_MODEL:-Qwen3.6-35B-A3B-FP8}
      VISION_DIRECT_API_KEY: ${VISION_DIRECT_API_KEY:-}
      VISION_TIMEOUT_MS: ${VISION_TIMEOUT_MS:-60000}
      VISION_FAIL_COOLDOWN_MS: ${VISION_FAIL_COOLDOWN_MS:-300000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-modelgate}
      EMBEDDING_DIRECT_BASE_URL: ${EMBEDDING_DIRECT_BASE_URL:-}
      EMBEDDING_DIRECT_MODEL: ${EMBEDDING_DIRECT_MODEL:-qwen3-vl-embedding-2b}
      LIPSYNC_PROVIDER: ${LIPSYNC_PROVIDER:-disabled}
      LIPSYNC_DIRECT_BASE_URL: ${LIPSYNC_DIRECT_BASE_URL:-}
      LIPSYNC_TIMEOUT_MS: ${LIPSYNC_TIMEOUT_MS:-900000}
      AI_REAL_ENABLED: "true"
      AI_TASK_CONCURRENCY: ${AI_TASK_CONCURRENCY:-1}
      H3_LOCK_URL: ${H3_LOCK_URL:-}
      H3_LOCK_KEY: ${H3_LOCK_KEY:-xtzc:h3:generation}
      TTS_TASK_CONCURRENCY: ${TTS_TASK_CONCURRENCY:-1}
      INDEX_TTS_BASE_URL: ${INDEX_TTS_BASE_URL:-}
      INDEX_TTS_SYNTHESIS_PROVIDER: ${INDEX_TTS_SYNTHESIS_PROVIDER:-modelgate}
      SUBTITLE_REPAIR_BASE_URL: ${SUBTITLE_REPAIR_BASE_URL:-}
      SUBTITLE_REPAIR_MODE: ${SUBTITLE_REPAIR_MODE:-sttn-det}
      SUBTITLE_REPAIR_BAND_TOP: ${SUBTITLE_REPAIR_BAND_TOP:-0.82}
      SUBTITLE_REPAIR_TIMEOUT_MS: ${SUBTITLE_REPAIR_TIMEOUT_MS:-900000}
      MG_IMAGE_DIRECT_BASE_URL: ${MG_IMAGE_DIRECT_BASE_URL:-}
      SUPER_RES_PROVIDER: ${SUPER_RES_PROVIDER:-modelgate}
      SEEDVR_DIRECT_BASE_URL: ${SEEDVR_DIRECT_BASE_URL:-}
      SEEDVR_DIRECT_WAIT_MS: ${SEEDVR_DIRECT_WAIT_MS:-5400000}
      SEEDVR_DIRECT_CHUNK_FRAMES: ${SEEDVR_DIRECT_CHUNK_FRAMES:-6}
      SEEDVR_LIPSYNC_SHARE_GPU: ${SEEDVR_LIPSYNC_SHARE_GPU:-true}
      SUPER_RES_POINTS_PER_SECOND: ${SUPER_RES_POINTS_PER_SECOND:-20}
      SUBTITLE_TRANSCRIBE_POINTS: ${SUBTITLE_TRANSCRIBE_POINTS:-10}
      ES_NODE: http://elasticsearch:9200
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${DEV_PORT:-3011}:3001"
    volumes:
      - ./server/src:/app/server/src:ro
      - ./client/dist:/app/client/dist:ro
      - app-data:/app/server/data
      - app-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  h3-lock:
    image: ${DEV_REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--save", ""]
    mem_limit: 96m
    volumes:
      - h3-lock-data:/data
  elasticsearch:
    image: ${DEV_ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - ./.dev-data/elasticsearch:/usr/share/elasticsearch/data
volumes:
  app-data:
  app-uploads:
  h3-lock-data:
